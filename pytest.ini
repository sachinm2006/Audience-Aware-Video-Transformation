[pytest]
pythonpath = . src tests/context_guard
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# OneDrive-managed directories reject pytest's cache writes; disable rather than
# emit a warning on every run.
addopts = -q -p no:cacheprovider --strict-markers
filterwarnings =
    ignore::DeprecationWarning:asyncio
